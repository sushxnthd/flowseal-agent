name: ICA closed-loop I x P audit

on:
  push:
    branches: ["research/ica-closed-loop"]
    paths:
      - "experiments/ica_closed_loop/**"
      - ".github/workflows/ica-closed-loop.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Decode frozen experiment
        run: |
          base64 -d experiments/ica_closed_loop/experiment.py.b64 > experiment.py
          python -m py_compile experiment.py
      - name: Run closed-loop audit
        run: |
          python experiment.py --out results --tasks 8 --concurrency 2
      - name: Print summary
        if: always()
        run: |
          test -f results/summary.json && cat results/summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ica-closed-loop-results
          path: results/
          if-no-files-found: warn
