<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>flowseal-agent</title><style>body{margin:0;background:#071411;color:#d7fff0;font:14px system-ui}header{padding:24px 30px;border-bottom:1px solid #1e493f}main{padding:28px}.canvas{position:relative;height:360px;background:radial-gradient(circle at 30% 30%,#0d2a22,#081612);border:1px solid #245044;border-radius:18px;overflow:hidden}.node{position:absolute;padding:14px 18px;border:1px solid #3f7b6a;border-radius:12px;background:#0e211c}.source{left:7%;top:42%}.tool{left:38%;top:20%}.sink{right:8%;top:42%}.line{position:absolute;height:2px;background:#34d399;transform-origin:left}.l1{left:20%;top:49%;width:220px;transform:rotate(-17deg)}.l2{left:50%;top:29%;width:250px;transform:rotate(18deg)}.tag{display:inline-block;padding:3px 7px;margin:3px;border-radius:20px;background:#273b36}.secret{background:#5b2131;color:#fecdd3}.controls{margin-top:18px;display:flex;gap:10px}.controls button{padding:10px 14px;border-radius:9px;border:1px solid #3f7b6a;background:#0f2e25;color:#d7fff0}.status{margin-top:18px;padding:16px;border-left:4px solid #34d399}.leak{border-color:#fb7185;color:#fecdd3}</style></head><body><header><b>flowseal-agent</b> / information-flow map</header><main><div class="canvas"><div class="line l1"></div><div class="line l2"></div><div class="node source">user input<br><span class="tag">public</span><span class="tag secret">secret</span></div><div class="node tool" id="tool">tool context<br><span class="tag secret" id="tooltag">secret</span></div><div class="node sink">analytics sink<br><span class="tag">allows public</span></div></div><div class="controls"><button onclick="setRedact(true)">enable redaction</button><button onclick="setRedact(false)">bypass redaction</button></div><div class="status" id="status">clean: secret label is removed before the sink</div></main><script>function setRedact(on){let s=document.getElementById('status'),t=document.getElementById('tooltag');if(on){t.textContent='secret -> removed';s.textContent='clean: secret label is removed before the sink';s.className='status'}else{t.textContent='secret';s.textContent='violation: secret reaches analytics sink via user input > tool context > analytics sink';s.className='status leak'}}</script></body></html>
